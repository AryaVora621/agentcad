<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>agentcad view</title>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <style>
    :root {
      --bg: #f8fafc;
      --panel: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }
    header {
      height: 48px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      gap: 12px;
      z-index: 20;
      flex-shrink: 0;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand {
      font-weight: 700;
      font-size: 15px;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text);
    }
    .brand-badge {
      background: #eff6ff;
      color: var(--accent);
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
    }
    .toolbar-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn {
      appearance: none;
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--text);
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease;
      white-space: nowrap;
      user-select: none;
    }
    .btn:hover {
      background: #f1f5f9;
      border-color: #cbd5e1;
    }
    .btn.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }
    .btn.active:hover {
      background: var(--accent-hover);
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      color: var(--text-muted);
    }
    #status-info {
      font-weight: 500;
    }
    #status-error {
      color: var(--danger);
      font-weight: 500;
    }
    #section-bar {
      display: none;
      height: 40px;
      background: #f8fafc;
      border-bottom: 1px solid var(--border);
      padding: 0 16px;
      align-items: center;
      gap: 14px;
      font-size: 12px;
      z-index: 15;
      flex-shrink: 0;
    }
    .section-axis-group {
      display: flex;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }
    .btn-axis {
      border: none;
      border-right: 1px solid var(--border);
      border-radius: 0;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 600;
    }
    .btn-axis:last-child {
      border-right: none;
    }
    .section-slider-container {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      max-width: 400px;
    }
    .section-slider-container input[type=range] {
      flex: 1;
      accent-color: var(--accent);
    }
    #main-content {
      display: flex;
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    #sidebar {
      width: 320px;
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 10;
      flex-shrink: 0;
      transition: transform 0.2s ease, margin-left 0.2s ease;
    }
    #sidebar.collapsed {
      margin-left: -320px;
    }
    .sidebar-header {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .file-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 0;
    }
    .file-item {
      padding: 8px 12px;
      border-bottom: 1px solid #f1f5f9;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      transition: background 0.1s ease;
    }
    .file-item:hover {
      background: #f8fafc;
    }
    .file-item input[type=checkbox] {
      margin-top: 3px;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .file-swatch {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      margin-top: 3px;
      flex-shrink: 0;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.1);
    }
    .file-info {
      flex: 1;
      min-width: 0;
    }
    .file-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
    }
    .file-name:hover {
      color: var(--accent);
      text-decoration: underline;
    }
    .file-meta {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .canvas-container {
      flex: 1;
      height: 100%;
      position: relative;
      outline: none;
    }
    @media (max-width: 768px) {
      #sidebar {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 280px;
        box-shadow: 2px 0 12px rgba(0,0,0,0.15);
        margin-left: 0;
        transform: translateX(-100%);
      }
      #sidebar.open {
        transform: translateX(0);
      }
      #sidebar.collapsed {
        transform: translateX(-100%);
        margin-left: 0;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <button id="btn-sidebar-toggle" class="btn" title="Toggle panel">Panel</button>
      <div class="brand">
        agentcad view
        <span class="brand-badge">3D</span>
      </div>
    </div>
    <div class="toolbar-group">
      <button id="btn-toggle-all" class="btn" title="Show or hide all parts">Show/Hide All</button>
      <button id="btn-fit" class="btn" title="Fit visible parts into view">Fit View</button>
      <button id="btn-wireframe" class="btn" title="Toggle wireframe display">Wireframe</button>
      <button id="btn-spread" class="btn" title="Lay parts out on an XY grid">Spread Out</button>
      <button id="btn-section" class="btn" title="Section cut plane">Section</button>
    </div>
    <div class="header-right">
      <span id="status-error"></span>
      <span id="status-info">0 files</span>
    </div>
  </header>

  <div id="section-bar">
    <span style="font-weight:600; color:var(--text-muted);">Section Axis:</span>
    <div class="section-axis-group">
      <button class="btn btn-axis" data-axis="X">X</button>
      <button class="btn btn-axis" data-axis="Y">Y</button>
      <button class="btn btn-axis active" data-axis="Z">Z</button>
    </div>
    <button id="btn-section-flip" class="btn" title="Flip cut direction">Flip</button>
    <div class="section-slider-container">
      <input type="range" id="section-slider" min="-100" max="100" step="0.5" value="0">
      <span id="section-readout" style="min-width:60px; font-variant-numeric:tabular-nums;">0.0 mm</span>
    </div>
  </div>

  <div id="main-content">
    <aside id="sidebar">
      <div class="sidebar-header">
        <span>Files</span>
      </div>
      <div id="file-list" class="file-list"></div>
    </aside>
    <div id="canvas-container" class="canvas-container"></div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { STLLoader } from 'three/addons/loaders/STLLoader.js';
    import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
    import { ThreeMFLoader } from 'three/addons/loaders/3MFLoader.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { PLYLoader } from 'three/addons/loaders/PLYLoader.js';

    const PALETTE = [
      '#38bdf8', '#fb923c', '#4ade80', '#f472b6',
      '#a78bfa', '#facc15', '#2dd4bf', '#fb7185',
      '#60a5fa', '#34d399', '#f87171', '#c084fc',
      '#818cf8', '#e879f9', '#a3e635'
    ];

    function getColor(id) {
      return PALETTE[id % PALETTE.length];
    }

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf8fafc);

    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100000);
    camera.up.set(0, 0, 1);
    camera.position.set(200, -250, 200);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.localClippingEnabled = true;
    renderer.clippingPlanes = [];
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.target.set(0, 0, 0);
    controls.update();

    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x94a3b8, 1.2);
    hemiLight.position.set(0, 0, 500);
    scene.add(hemiLight);

    const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.4);
    dirLight1.position.set(300, -400, 500);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.6);
    dirLight2.position.set(-300, 400, -200);
    scene.add(dirLight2);

    let gridHelper = null;
    function setupGrid(size = 300) {
      if (gridHelper) scene.remove(gridHelper);
      const divisions = Math.max(10, Math.round(size / 10));
      gridHelper = new THREE.GridHelper(size, divisions, 0x94a3b8, 0xe2e8f0);
      gridHelper.rotation.x = Math.PI / 2;
      scene.add(gridHelper);
    }
    setupGrid(300);

    const axesHelper = new THREE.AxesHelper(40);
    scene.add(axesHelper);

    let bedLine = null;
    let currentBed = null;
    function updateBed(bed) {
      if (bedLine) {
        scene.remove(bedLine);
        bedLine.geometry.dispose();
        bedLine.material.dispose();
        bedLine = null;
      }
      currentBed = bed;
      if (!bed) return;
      const [w, d] = bed;
      const hw = w / 2;
      const hd = d / 2;
      const pts = [
        new THREE.Vector3(-hw, -hd, 0),
        new THREE.Vector3(hw, -hd, 0),
        new THREE.Vector3(hw, hd, 0),
        new THREE.Vector3(-hw, hd, 0)
      ];
      const geom = new THREE.BufferGeometry().setFromPoints(pts);
      const mat = new THREE.LineBasicMaterial({ color: 0x2563eb, linewidth: 2 });
      bedLine = new THREE.LineLoop(geom, mat);
      scene.add(bedLine);

      const maxDim = Math.max(w, d);
      setupGrid(Math.ceil((maxDim + 50) / 50) * 50);
    }

    const partsRoot = new THREE.Group();
    scene.add(partsRoot);

    const loadedFiles = new Map();
    let isWireframe = false;
    let isSpread = false;
    let sectionActive = false;
    let sectionAxis = 'Z';
    let sectionInverted = false;
    let sectionValue = 0;
    const clipPlane = new THREE.Plane(new THREE.Vector3(0, 0, -1), 0);

    function updateClippingPlane() {
      if (!sectionActive) {
        renderer.clippingPlanes = [];
        return;
      }
      const dir = sectionInverted ? 1 : -1;
      let normal;
      let constant;
      if (sectionAxis === 'X') {
        normal = new THREE.Vector3(dir, 0, 0);
        constant = sectionInverted ? -sectionValue : sectionValue;
      } else if (sectionAxis === 'Y') {
        normal = new THREE.Vector3(0, dir, 0);
        constant = sectionInverted ? -sectionValue : sectionValue;
      } else {
        normal = new THREE.Vector3(0, 0, dir);
        constant = sectionInverted ? -sectionValue : sectionValue;
      }
      clipPlane.set(normal, constant);
      renderer.clippingPlanes = [clipPlane];
      document.getElementById('section-readout').textContent = `${sectionValue.toFixed(1)} mm`;
    }

    function createPartFromGeometry(geom, file) {
      const group = new THREE.Group();
      group.name = `file_${file.id}`;
      const color = file.color || getColor(file.id);
      const darkColor = new THREE.Color(color).multiplyScalar(0.35);
      const clear = file.opacity != null && file.opacity < 1;

      const frontMat = new THREE.MeshStandardMaterial({
        color: color,
        roughness: 0.35,
        metalness: 0.15,
        side: THREE.FrontSide,
        wireframe: isWireframe
      });
      if (clear) {
        frontMat.transparent = true;
        frontMat.opacity = file.opacity;
        frontMat.depthWrite = false;
      }
      const frontMesh = new THREE.Mesh(geom, frontMat);
      group.add(frontMesh);
      // A translucent part gets no dark back shell: it would show through as a grey ghost.
      if (!clear) {
        const backMat = new THREE.MeshStandardMaterial({
          color: darkColor,
          roughness: 0.8,
          metalness: 0.1,
          side: THREE.BackSide,
          wireframe: isWireframe
        });
        group.add(new THREE.Mesh(geom, backMat));
      }
      return group;
    }

    function setupPartGroup(rawGroup, file) {
      const group = new THREE.Group();
      group.name = `file_${file.id}`;
      const color = file.color || getColor(file.id);
      const darkColor = new THREE.Color(color).multiplyScalar(0.35);
      const clear = file.opacity != null && file.opacity < 1;

      const meshes = [];
      rawGroup.traverse(child => {
        if (child.isMesh) meshes.push(child);
      });

      for (const mesh of meshes) {
        if (!mesh.geometry.attributes.normal) {
          mesh.geometry.computeVertexNormals();
        }
        mesh.material = new THREE.MeshStandardMaterial({
          color: color,
          roughness: 0.35,
          metalness: 0.15,
          side: THREE.FrontSide,
          wireframe: isWireframe
        });
        if (clear) {
          mesh.material.transparent = true;
          mesh.material.opacity = file.opacity;
          mesh.material.depthWrite = false;
        }
        group.add(mesh);
        if (!clear) {
          group.add(new THREE.Mesh(mesh.geometry, new THREE.MeshStandardMaterial({
            color: darkColor,
            roughness: 0.8,
            metalness: 0.1,
            side: THREE.BackSide,
            wireframe: isWireframe
          })));
        }
      }
      if (group.children.length === 0) {
        group.add(rawGroup);
      }
      return group;
    }

    async function loadMeshFile(file) {
      const url = `/files/${file.id}`;
      const ext = file.name.substring(file.name.lastIndexOf('.')).toLowerCase();

      if (ext === '.stl') {
        const geom = await new STLLoader().loadAsync(url);
        geom.computeVertexNormals();
        return createPartFromGeometry(geom, file);
      } else if (ext === '.ply') {
        const geom = await new PLYLoader().loadAsync(url);
        geom.computeVertexNormals();
        return createPartFromGeometry(geom, file);
      } else if (ext === '.obj') {
        const raw = await new OBJLoader().loadAsync(url);
        return setupPartGroup(raw, file);
      } else if (ext === '.3mf') {
        const raw = await new ThreeMFLoader().loadAsync(url);
        return setupPartGroup(raw, file);
      } else if (ext === '.glb' || ext === '.gltf') {
        const gltf = await new GLTFLoader().loadAsync(url);
        return setupPartGroup(gltf.scene, file);
      }
      throw new Error(`Unsupported file type: ${ext}`);
    }

    function calculateStats(group) {
      const box = new THREE.Box3().setFromObject(group);
      const size = new THREE.Vector3();
      box.getSize(size);
      let tris = 0;
      group.traverse(child => {
        if (child.isMesh && child.material && child.material.side === THREE.FrontSide) {
          const geom = child.geometry;
          if (geom.index) {
            tris += geom.index.count / 3;
          } else if (geom.attributes && geom.attributes.position) {
            tris += geom.attributes.position.count / 3;
          }
        }
      });
      return { size, tris: Math.round(tris) };
    }

    function fitView(targetObj = null) {
      const box = new THREE.Box3();
      if (targetObj) {
        box.setFromObject(targetObj);
      } else {
        let hasVis = false;
        for (const item of loadedFiles.values()) {
          if (item.visible && item.group) {
            box.expandByObject(item.group);
            hasVis = true;
          }
        }
        if (!hasVis) {
          if (currentBed) {
            box.min.set(-currentBed[0]/2, -currentBed[1]/2, 0);
            box.max.set(currentBed[0]/2, currentBed[1]/2, 10);
          } else {
            box.min.set(-100, -100, 0);
            box.max.set(100, 100, 50);
          }
        }
      }
      if (box.isEmpty()) return;

      const center = new THREE.Vector3();
      box.getCenter(center);
      const size = new THREE.Vector3();
      box.getSize(size);
      const maxDim = Math.max(size.x, size.y, size.z, 20);

      const fov = camera.fov * (Math.PI / 180);
      let dist = Math.abs(maxDim / (2 * Math.tan(fov / 2))) * 1.5;
      dist = Math.max(dist, 50);

      const dir = new THREE.Vector3(1.0, -1.2, 0.9).normalize();
      camera.position.copy(center).addScaledVector(dir, dist);
      controls.target.copy(center);

      camera.near = Math.max(0.1, dist / 200);
      camera.far = Math.max(10000, dist * 50);
      camera.updateProjectionMatrix();
      controls.update();
    }

    function applySpreadLayout() {
      const visibleItems = [];
      for (const item of loadedFiles.values()) {
        if (item.visible && item.group) {
          visibleItems.push(item);
        }
      }

      if (!isSpread) {
        for (const item of loadedFiles.values()) {
          if (item.group) item.group.position.set(0, 0, 0);
        }
        return;
      }

      if (visibleItems.length <= 1) {
        if (visibleItems.length === 1) visibleItems[0].group.position.set(0, 0, 0);
        return;
      }

      const partData = visibleItems.map(item => {
        const curPos = item.group.position.clone();
        item.group.position.set(0, 0, 0);
        const box = new THREE.Box3().setFromObject(item.group);
        item.group.position.copy(curPos);
        const size = new THREE.Vector3();
        box.getSize(size);
        const center = new THREE.Vector3();
        box.getCenter(center);
        return { item, size, center };
      });

      let maxW = 0;
      let maxD = 0;
      for (const p of partData) {
        if (p.size.x > maxW) maxW = p.size.x;
        if (p.size.y > maxD) maxD = p.size.y;
      }

      const gap = Math.max(20, Math.max(maxW, maxD) * 0.15);
      const stepX = maxW + gap;
      const stepY = maxD + gap;

      const count = partData.length;
      const cols = Math.ceil(Math.sqrt(count));
      const rows = Math.ceil(count / cols);

      partData.forEach((p, idx) => {
        const col = idx % cols;
        const row = Math.floor(idx / cols);
        const targetX = (col - (cols - 1) / 2) * stepX;
        const targetY = (row - (rows - 1) / 2) * stepY;
        p.item.group.position.set(targetX - p.center.x, targetY - p.center.y, 0);
      });
    }

    function updateSectionBounds() {
      const box = new THREE.Box3();
      let hasVis = false;
      for (const item of loadedFiles.values()) {
        if (item.visible && item.group) {
          box.expandByObject(item.group);
          hasVis = true;
        }
      }
      if (!hasVis) {
        box.min.set(-100, -100, 0);
        box.max.set(100, 100, 50);
      }
      const axisKey = sectionAxis.toLowerCase();
      const min = Math.floor(box.min[axisKey] - 2);
      const max = Math.ceil(box.max[axisKey] + 2);
      const slider = document.getElementById('section-slider');
      slider.min = min;
      slider.max = max;
      if (sectionValue < min || sectionValue > max || sectionValue === 0) {
        sectionValue = (min + max) / 2;
        slider.value = sectionValue;
      }
      updateClippingPlane();
    }

    function renderUI() {
      const listEl = document.getElementById('file-list');
      listEl.innerHTML = '';
      let totalTris = 0;
      let visibleCount = 0;

      for (const item of loadedFiles.values()) {
        if (item.visible) {
          visibleCount++;
          totalTris += (item.tris || 0);
        }

        const div = document.createElement('div');
        div.className = 'file-item';

        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = item.visible;
        cb.addEventListener('change', () => {
          item.visible = cb.checked;
          if (item.group) item.group.visible = cb.checked;
          if (isSpread) applySpreadLayout();
          renderUI();
        });

        const swatch = document.createElement('div');
        swatch.className = 'file-swatch';
        swatch.style.background = getColor(item.id);

        const info = document.createElement('div');
        info.className = 'file-info';

        const nameSpan = document.createElement('span');
        nameSpan.className = 'file-name';
        nameSpan.textContent = item.name;
        nameSpan.title = `${item.rel || item.name} (Click to frame)`;
        nameSpan.addEventListener('click', () => {
          if (!item.visible) {
            item.visible = true;
            if (item.group) item.group.visible = true;
            cb.checked = true;
            if (isSpread) applySpreadLayout();
            renderUI();
          }
          if (item.group) fitView(item.group);
        });

        const meta = document.createElement('div');
        meta.className = 'file-meta';
        if (item.error) {
          meta.innerHTML = `<span style="color:var(--danger)">Failed to load</span>`;
        } else if (item.sizeVec) {
          const dims = `${item.sizeVec.x.toFixed(1)} x ${item.sizeVec.y.toFixed(1)} x ${item.sizeVec.z.toFixed(1)} mm`;
          meta.textContent = `${dims} | ${(item.tris || 0).toLocaleString()} tris`;
        } else {
          meta.textContent = 'Loading...';
        }

        info.appendChild(nameSpan);
        info.appendChild(meta);
        div.appendChild(cb);
        div.appendChild(swatch);
        div.appendChild(info);
        listEl.appendChild(div);
      }

      const statusInfo = document.getElementById('status-info');
      statusInfo.textContent = `${loadedFiles.size} file${loadedFiles.size === 1 ? '' : 's'} | ${totalTris.toLocaleString()} triangles`;
    }

    let isInitialLoad = true;
    let isPolling = false;

    async function pollFiles() {
      if (isPolling) return;
      isPolling = true;
      try {
        const res = await fetch('/api/files');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        updateBed(data.bed);

        const serverFiles = data.files || [];
        const serverIds = new Set(serverFiles.map(f => f.id));

        for (const [id, item] of loadedFiles.entries()) {
          if (!serverIds.has(id)) {
            if (item.group) {
              partsRoot.remove(item.group);
              item.group.traverse(c => {
                if (c.geometry) c.geometry.dispose();
                if (c.material) c.material.dispose();
              });
            }
            loadedFiles.delete(id);
          }
        }

        let changed = false;
        for (const file of serverFiles) {
          const existing = loadedFiles.get(file.id);
          if (!existing) {
            const item = {
              id: file.id,
              name: file.name,
              rel: file.rel,
              size: file.size,
              mtime: file.mtime,
              visible: true,
              group: null,
              sizeVec: null,
              tris: 0,
              error: null
            };
            loadedFiles.set(file.id, item);
            changed = true;
            try {
              const group = await loadMeshFile(file);
              item.group = group;
              const stats = calculateStats(group);
              item.sizeVec = stats.size;
              item.tris = stats.tris;
              partsRoot.add(group);
            } catch (err) {
              console.error(err);
              item.error = err.message || String(err);
              const errEl = document.getElementById('status-error');
              errEl.textContent = `Failed to load ${file.name}: ${item.error}`;
              errEl.style.display = 'inline';
            }
          } else if (existing.mtime !== file.mtime || existing.size !== file.size) {
            existing.mtime = file.mtime;
            existing.size = file.size;
            existing.error = null;
            changed = true;
            if (existing.group) {
              partsRoot.remove(existing.group);
              existing.group.traverse(c => {
                if (c.geometry) c.geometry.dispose();
                if (c.material) c.material.dispose();
              });
            }
            try {
              const group = await loadMeshFile(file);
              existing.group = group;
              group.visible = existing.visible;
              const stats = calculateStats(group);
              existing.sizeVec = stats.size;
              existing.tris = stats.tris;
              partsRoot.add(group);
            } catch (err) {
              console.error(err);
              existing.error = err.message || String(err);
              const errEl = document.getElementById('status-error');
              errEl.textContent = `Failed to reload ${file.name}: ${existing.error}`;
              errEl.style.display = 'inline';
            }
          }
        }

        if (changed || isInitialLoad) {
          if (isSpread) applySpreadLayout();
          renderUI();
          if (isInitialLoad) {
            fitView();
            isInitialLoad = false;
          }
        }
      } catch (err) {
        console.error('Polling error:', err);
      } finally {
        isPolling = false;
      }
    }

    document.getElementById('btn-sidebar-toggle').addEventListener('click', () => {
      const sidebar = document.getElementById('sidebar');
      if (window.innerWidth <= 768) {
        sidebar.classList.toggle('open');
      } else {
        sidebar.classList.toggle('collapsed');
      }
      setTimeout(() => onWindowResize(), 220);
    });

    document.getElementById('btn-toggle-all').addEventListener('click', () => {
      let anyVis = false;
      for (const item of loadedFiles.values()) {
        if (item.visible) { anyVis = true; break; }
      }
      const target = !anyVis;
      for (const item of loadedFiles.values()) {
        item.visible = target;
        if (item.group) item.group.visible = target;
      }
      if (isSpread) applySpreadLayout();
      renderUI();
    });

    document.getElementById('btn-fit').addEventListener('click', () => fitView());

    const wireframeBtn = document.getElementById('btn-wireframe');
    wireframeBtn.addEventListener('click', () => {
      isWireframe = !isWireframe;
      wireframeBtn.classList.toggle('active', isWireframe);
      partsRoot.traverse(child => {
        if (child.isMesh && child.material) {
          child.material.wireframe = isWireframe;
        }
      });
    });

    const spreadBtn = document.getElementById('btn-spread');
    spreadBtn.addEventListener('click', () => {
      isSpread = !isSpread;
      spreadBtn.classList.toggle('active', isSpread);
      applySpreadLayout();
    });

    const sectionBtn = document.getElementById('btn-section');
    const sectionBar = document.getElementById('section-bar');
    sectionBtn.addEventListener('click', () => {
      sectionActive = !sectionActive;
      sectionBtn.classList.toggle('active', sectionActive);
      sectionBar.style.display = sectionActive ? 'flex' : 'none';
      if (sectionActive) {
        updateSectionBounds();
      } else {
        updateClippingPlane();
      }
    });

    document.querySelectorAll('.btn-axis').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.btn-axis').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        sectionAxis = btn.dataset.axis;
        updateSectionBounds();
      });
    });

    document.getElementById('btn-section-flip').addEventListener('click', () => {
      sectionInverted = !sectionInverted;
      updateClippingPlane();
    });

    document.getElementById('section-slider').addEventListener('input', (e) => {
      sectionValue = parseFloat(e.target.value);
      updateClippingPlane();
    });

    function onWindowResize() {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    }
    window.addEventListener('resize', onWindowResize);

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    requestAnimationFrame(animate);

    pollFiles();
    setInterval(pollFiles, 2000);
  </script>
</body>
</html>
